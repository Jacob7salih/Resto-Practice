<div class=" hero-scene text-center text-white ">
  <div class=" hero-scene-content">
    <h1>Mon Compte</h1>
  </div>
</div>

<div class="container">

  <form>
    <div class="mb-3">
      <label for="NomInput" class="form-label">Nom</label>
      <input type="etext" class="form-control" id="NomInput" placeholder="votre nom" value="john">
    </div>
    <div class="mb-3">
      <label for="PrénomInput" class="form-label">Prénom</label>
      <input type="etext" class="form-control" id="PrénomInput" placeholder="votre prénom" value="doe">
    </div>
    <div class="mb-3">
      <label for="AlergieInput" class="form-label">Alergies</label>
      <input type="text" class="form-control" id="AllergieInput" placeholder="Vos allergies (fruits de mer, arachides…)"
        value="Cacahouetes" name="Allergies">
    </div>
    <div class=" mb-3 ">
      <label for=" NbconvivesInput" class="form-label">Nombres de convives habituel</label>
      <input type="number" class="form-control" id="NbconvivesInput" placeholder="Nombres de convives habituel"
        value="2" name="Nbconvives">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary text-center">Modifier vos informations</button>
    </div>
    <div class="text-center pt-3 pb-4">
      <a href="/editPassword">Cliquez ici pour modifier votre mot de passe</a>
    </div>
  </form>
</div>

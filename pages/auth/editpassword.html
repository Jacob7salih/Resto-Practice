<div class=" hero-scene text-center text-white ">
  <div class=" hero-scene-content">
    <h1>Changement de mot de passe</h1>
  </div>
</div>

<div class="container">

  <form>

    <div class=" mb-3 ">
      <label for="PasswordInput" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="PasswordInput" placeholder="Mot de passe">
    </div>
    <div class=" mb-3 ">
      <label for="ValidatedpasswordInput" class="form-label">Valider le mot de passe</label>
      <input type="password" class="form-control" id="ValidatedpasswordInput" placeholder="Confirmer le mot de passe">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary text-center">Changer le mot de passe</button>
      <button type="button" class="btn btn-danger text-center">Supprimer mon compte</button>
    </div>
    <div class="text-center pt-3 pb-4">
      <a href="/account">Modifier les informations personnelles</a>
    </div>
  </form>
</div>

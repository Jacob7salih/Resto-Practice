<div class=" hero-scene text-center text-white ">
  <div class=" hero-scene-content">
    <h1>Inscription</h1>
  </div>
</div>

<div class="container">

  <form>
    <div class="mb-3">
      <label for="NomInput" class="form-label">Nom</label>
      <input type="etext" class="form-control" id="NomInput" placeholder="votre nom">
    </div>
    <div class="mb-3">
      <label for="PrénomInput" class="form-label">Prénom</label>
      <input type="etext" class="form-control" id="PrénomInput" placeholder="votre prénom">
    </div>
    <div class="mb-3">
      <label for="EmailInput" class="form-label">Email</label>
      <input type="email" class="form-control" id="EmailInput" placeholder="test@emil.fr">
    </div>
    <div class=" mb-3 ">
      <label for="PasswordInput" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="PasswordInput" placeholder="Mot de passe">
    </div>
    <div class=" mb-3 ">
      <label for="ValidatedpasswordInput" class="form-label">Confirmer le mot de passe</label>
      <input type="password" class="form-control" id="ValidatedpasswordInput" placeholder="Confirmer le mot de passe">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary text-center">Inscription</button>
    </div>

  </form>
  <div class="text-center pt-3">
    <a href="/signin">Vous avez déjà un compte ? Connectez-vous ici !</a>
  </div>
</div>
